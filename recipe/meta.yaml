{% set name = "mpiplus" %}
{% set version = "0.0.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/m/mpiplus/mpiplus-${{ version }}.tar.gz
  sha256: f453ecb8701aad00f189e08c8542ce559219db946a1534cdcb7242576f73520b

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.11

test:
  requires:
    - pytest
    - coverage >=4.4
    - mpi4py
    - python {{ python_min }}
  imports:
    - mpiplus

about:
  home: http://github.com/choderalab/mpiplus
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Utilities to run on MPI'

  description: |
    Mpiplus is a GPU-accelerated Python framework for exploring 
    algorithms for alchemical free energy calculations
  doc_url: http://mpiplus.readthedocs.io/
  dev_url: https://github.com/choderalab/mpiplus

extra:
  recipe-maintainers:
    - ijpulidos
    - mikemhenry
    - jchodera
